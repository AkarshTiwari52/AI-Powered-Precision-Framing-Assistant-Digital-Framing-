<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<title>Agri Assistant</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .chat-box {
    width: 100%;
    max-width: 500px;
    height: 90vh;
    background: #ffffff;
    border: 1px solid #ccc;
    display: flex;
    flex-direction: column;
  }

  .header {
    background: #2e7d32;
    color: white;
    padding: 12px;
    text-align: center;
    font-size: 18px;
  }

  .messages {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    background: #f9fafb;
  }

  .bot {
    background: #e5e7eb;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    width: fit-content;
  }

  .user {
    background: #2e7d32;
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    margin-left: auto;
    width: fit-content;
  }

  .input-box {
    display: flex;
    gap: 5px;
    padding: 10px;
    border-top: 1px solid #ccc;
  }

  input {
    flex: 1;
    padding: 8px;
    font-size: 14px;
  }

  button {
    padding: 8px 10px;
    font-size: 14px;
    cursor: pointer;
  }

  select {
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="chat-box">
  <div class="header">Agri Assistant</div>

  <div class="messages" id="chat">
    <div class="bot">Hello  Ask me about farming.</div>
  </div>

  <div class="input-box">
    <input type="text" id="question" placeholder="Type your question">
    <button onclick="startMic()"><i class="ri-mic-2-line"></i></button>
    <button onclick="sendMsg()">Send</button>
  </div>

  <div style="padding:5px;">
    <select id="language">
      <option>English</option>
      <option>Hindi</option>
      <option>Telugu</option>
    </select>
  </div>
</div>

<script>
function getLangCode(lang) {
  if (lang === "Hindi") return "hi-IN";
  if (lang === "Telugu") return "te-IN";
  return "en-IN";
}

async function sendMsg() {
  const input = document.getElementById("question");
  const chat = document.getElementById("chat");
  const language = document.getElementById("language").value;
  const text = input.value.trim();

  if (!text) return;

  chat.innerHTML += `<div class="user">${text}</div>`;
  input.value = "";
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ message: text, language })
    });

    const data = await res.json();
    chat.innerHTML += `<div class="bot">${data.reply}</div>`;
    chat.scrollTop = chat.scrollHeight;
  } catch {
    chat.innerHTML += `<div class="bot">Server error ❌</div>`;
  }
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = new SpeechRecognition();

function startMic() {
  const language = document.getElementById("language").value;
  recognition.lang = getLangCode(language);
  recognition.start();
}

recognition.onresult = function(event) {
  document.getElementById("question").value =
    event.results[0][0].transcript;
};
</script>

</body>
</html>
