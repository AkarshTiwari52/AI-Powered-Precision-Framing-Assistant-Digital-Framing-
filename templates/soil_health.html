<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>AgrioSense AI | Soil Health Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary: #2f855a;
      --primary-dark: #276749;
      --bg: #f7fafc;
      --card: #ffffff;
      --text: #1a202c;
      --muted: #718096;

      --green: #c6f6d5;
      --yellow: #fefcbf;
      --red: #fed7d7;
      --blue: #bee3f8;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      padding: 30px;
      background: var(--bg);
      color: var(--text);
    }

    /* ===== HEADER ===== */
    .header {
      max-width: 1200px;
      margin: auto;
      text-align: center;
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--muted);
      font-size: 1rem;
    }

    /* ===== FORM WRAPPER ===== */
    .form-box {
      max-width: 1200px;
      margin: auto;
      background: var(--card);
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
    }

    /* ===== GRID ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    /* ===== INPUT CARD ===== */
    .card {
      background: #f8fafc;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }

    .card label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #2d3748;
    }

    .card input,
    .card select {
      margin-top: 6px;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #cbd5e0;
      font-size: 0.9rem;
    }

    /* ===== PHONE INPUT ===== */
    .phone-input {
      display: flex;
      gap: 10px;
    }

    /* ===== BUTTON ===== */
    .submit-btn {
      margin: 40px auto 10px;
      display: block;
      padding: 15px 55px;
      background: var(--primary);
      color: white;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      transition: 0.3s;
    }

    .submit-btn:hover {
      background: var(--primary-dark);
    }

    /* ===== RESULT SECTION ===== */
    .output-section {
      max-width: 1200px;
      margin: 50px auto 0;
    }

    .output-title {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 25px;
    }

    /* ===== RESULT CARD ===== */
    .result-card {
      padding: 20px;
      border-radius: 16px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    .result-card span {
      display: block;
      margin-top: 6px;
      font-size: 0.85rem;
      font-weight: 400;
      color: #2d3748;
    }

    /* STATUS COLORS */
    .green {
      background: var(--green)
    }

    .yellow {
      background: var(--yellow)
    }

    .red {
      background: var(--red)
    }

    .blue {
      background: var(--blue)
    }

    /* ===== FOOT NOTE ===== */
    .note {
      text-align: center;
      margin-top: 25px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🌾 AgriTech AI</h1>
    <p>Smart Soil Health Analysis & SMS Alert System</p>
  </div>

  <form method="POST" action="/soil_health">
    <div class="form-box">

      <div class="grid">
        <div class="card">
          <label>🧪 Nitrogen (N)</label>
          <input name="n" required>
        </div>

        <div class="card">
          <label>🧪 Phosphorus (P)</label>
          <input name="p" required>
        </div>

        <div class="card">
          <label>🧪 Potassium (K)</label>
          <input name="k" required>
        </div>

        <div class="card">
          <label>💧 Soil Moisture (%)</label>
          <input name="moisture" required>
        </div>

        <div class="card">
          <label>🌡 Temperature (°C)</label>
          <input name="temp" required>
        </div>

        <div class="card">
          <label>🌬 Humidity (%)</label>
          <input name="humidity" required>
        </div>

        <div class="card">
          <label>📱 Mobile Number (SMS Alerts)</label>
          <div class="phone-input">
            <select name="country_code">
              <option value="+91">🇮🇳 +91</option>
              <option value="+1">🇺🇸 +1</option>
              <option value="+44">🇬🇧 +44</option>
            </select>
            <input name="whatsapp_number" placeholder="Mobile number" required>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn">
        🌱 Analyze Soil Health
      </button>

    </div>
  </form>

  {% if results %}
  <div class="output-section">
    <h2 class="output-title">📊 Soil Health Report</h2>

    <div class="grid">
      {% for r in results %}
      <div class="result-card {{ r[2] }}">
        {{ r[0] }}
        <span>{{ r[1] }}</span>
      </div>
      {% endfor %}
    </div>

    <p class="note">
      📩 Critical alerts are automatically sent via SMS for timely action
    </p>
  </div>
  {% endif %}

</body>

</html>
