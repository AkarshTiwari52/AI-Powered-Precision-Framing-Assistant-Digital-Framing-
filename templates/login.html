<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Agri Login</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #2d6a4f, #95d5b2);
      font-family: "Segoe UI", sans-serif;
    }

    .login-box {
      background: #fff;
      width: 380px;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2d6a4f;
      border: none;
      border-radius: 25px;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="login-box">
    <h1>🌱 Agri Login</h1>

    <form method="POST" action="/login">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p>New farmer? <a href="/signup">Create account</a></p>
  </div>
</body>

</html>
